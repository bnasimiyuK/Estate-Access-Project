<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* Custom Card Style for consistency */
    .card {
      background-color: white;
      border-radius: 0.75rem; /* rounded-xl */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
      transition: all 0.3s ease;
      border: 1px solid #e5e7eb; /* border-gray-200 */
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-green-600 text-white p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold">Security Dashboard</h1>
    <div class="relative">
      <button id="userMenuBtn" class="flex items-center space-x-2 p-2 rounded-full hover:bg-green-700 transition">
        <span id="loggedInUserName" class="font-semibold">User</span> <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </button>

      <div id="userMenuDropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-xl z-50 hidden">
        <div class="py-1">
          <a href="#" id="myProfileLink" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">My Profile</a>
          <button id="logoutBtn" class="w-full text-left block px-4 py-2 text-sm text-red-600 hover:bg-red-50 hover:text-red-700">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <div class="flex">
    <aside class="w-64 bg-gray-800 text-white min-h-screen p-4 shadow-2xl">
      <nav class="flex flex-col space-y-2">
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="dashboard" data-target="securitydashboardoverview.html">Dashboard</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="accessLogs" data-target="accesslogs.html">Access Logs</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="visitorManagement" data-target="visitorsaccess.html">Visitor Management</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="manualGate" data-target="manualgate.html">Manual Gate Control</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="residentManagement" data-target="residents.html">Resident Management</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="paymentVerification" data-target="payments.html">Payment & Verification</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="reportsAnalytics" data-target="reportsanalysis.html">Reports & Analytics</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="notificationAlerts" data-target="notificationalerts.html">Notification & Alerts</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="securityRolemanagement" data-target="securitydashboard.html">Security & Role Management</button>
        <button class="tabBtn sidebarBtn p-2 rounded hover:bg-gray-700 text-left" data-tab="systemIntegration" data-target="systemintegration.html">System Integration</button>
      </nav>
    </aside>

    <main id="main-content-area" class="flex-1 p-6">
      <div class="text-center p-10 text-gray-500">
        <svg class="w-12 h-12 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        <p>Select a navigation item to view the content.</p>
      </div>
    </main>
  </div>

  <script src="./js/securitydashboard.js"></script>
</body>
</html>
