<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Dashboard | Athi Soko Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Poppins", sans-serif; background: #f4f7fb; color: #1f2937; }
a { text-decoration: none; color: inherit; }
.top-header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 45px; height: 45px; border-radius: 12px; background: #1e3a8a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.brand h1 { font-size: 18px; color: #1e3a8a; }
.brand span { display: block; font-size: 11px; color: #6b7280; }
.container { max-width: 1000px; margin: 26px auto; padding: 0 20px; }
.provider-switch { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 13px; }
.provider-switch select { border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; }
.tab-btn { border: 0; background: none; padding: 10px 16px; font-size: 13px; font-weight: 600; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: #1d4ed8; border-color: #1d4ed8; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 22px; margin-bottom: 18px; }
.card h3 { font-size: 15px; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 7px; padding: 9px 11px; font-size: 13px; font-family: inherit; outline: none; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.btn { padding: 9px 16px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 12px; border: 1px solid transparent; }
.btn-primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
.btn-outline { background: #fff; border-color: #d1d5db; color: #374151; }
.btn-danger { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
.status-note { font-size: 12px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
.status-Pending { background: #fef9c3; color: #854d0e; }
.status-UnderReview, .status-UnderReview_ { background: #dbeafe; color: #1e3a8a; }
.status-Verified { background: #dcfce7; color: #166534; }
.status-Suspended { background: #fee2e2; color: #991b1b; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid #f0f0f0; }
th { color: #6b7280; font-size: 11px; text-transform: uppercase; }
.badge { padding: 4px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-pending { background: #fef9c3; color: #854d0e; }
.badge-accepted { background: #dbeafe; color: #1e3a8a; }
.badge-completed { background: #dcfce7; color: #166534; }
.badge-cancelled { background: #fee2e2; color: #991b1b; }
.row-actions { display: flex; gap: 6px; }
.service-item { display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
.availability-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; }
</style>
</head>
<body>

<header class="top-header">
    <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-house-circle-check"></i></div>
        <div><h1>Athi Soko Connect</h1><span>Provider Dashboard</span></div>
    </div>
    <a href="services-search.html" style="font-size:13px;color:#4b5563;">Exit to Marketplace</a>
</header>

<main class="container">

    <div class="provider-switch">
        <i class="fa-solid fa-store" aria-hidden="true"></i>
        Managing profile for:
        <select id="providerSwitch"></select>
        <span style="color:#6b7280;">(demo: switch to view any registered provider)</span>
    </div>

    <div id="statusNote" class="status-note"></div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="profile">My Profile</button>
        <button class="tab-btn" data-tab="services">Services & Availability</button>
        <button class="tab-btn" data-tab="bookings">My Bookings</button>
    </div>

    <!-- PROFILE TAB -->
    <div class="tab-panel active" id="tab-profile">
        <div class="card">
            <h3>Business Profile</h3>
            <form id="profileForm">
                <div class="two-col">
                    <div class="field"><label>Business Name</label><input type="text" id="pBusinessName"></div>
                    <div class="field"><label>Owner / Contact Person</label><input type="text" id="pOwnerName"></div>
                </div>
                <div class="two-col">
                    <div class="field">
                        <label>Category</label>
                        <select id="pCategory">
                            <option>Cleaning</option><option>Plumbing</option><option>Electrical</option>
                            <option>Security</option><option>Gardening</option><option>Beauty</option>
                            <option>Transport</option><option>Repairs</option><option>Food</option>
                            <option>Tutoring</option><option>Technology</option><option>Laundry</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Court / Location</label>
                        <select id="pCourt">
                            <option>Riverside</option><option>Phase I</option><option>Phase II</option>
                            <option>Central</option><option>Estate-wide</option>
                        </select>
                    </div>
                </div>
                <div class="two-col">
                    <div class="field"><label>Phone</label><input type="tel" id="pPhone"></div>
                    <div class="field"><label>Email</label><input type="email" id="pEmail"></div>
                </div>
                <div class="field"><label>Operating Hours</label><input type="text" id="pHours"></div>
                <div class="field"><label>Description</label><textarea id="pDescription" rows="3"></textarea></div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
            </form>
        </div>
    </div>

    <!-- SERVICES TAB -->
    <div class="tab-panel" id="tab-services">
        <div class="card">
            <h3>Add a Service</h3>
            <form id="serviceForm">
                <div class="two-col">
                    <div class="field"><label>Service Name</label><input type="text" id="sName" required></div>
                    <div class="field"><label>Category</label><input type="text" id="sCategory" required></div>
                </div>
                <div class="two-col">
                    <div class="field"><label>Price (KES)</label><input type="number" id="sPrice" required></div>
                    <div class="field"><label>Price Unit</label><input type="text" id="sPriceUnit" placeholder="e.g. per visit, from, per hour" required></div>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Service</button>
            </form>
        </div>

        <div class="card">
            <h3>My Services</h3>
            <div id="servicesList"></div>
        </div>
    </div>

    <!-- BOOKINGS TAB -->
    <div class="tab-panel" id="tab-bookings">
        <div class="card">
            <h3>Booking Requests</h3>
            <table>
                <thead>
                    <tr><th>Resident</th><th>Service</th><th>Date</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="bookingsBody"></tbody>
            </table>
        </div>
    </div>

</main>

<script src="shared-data.js"></script>
<script>
let currentProviderId = Number(localStorage.getItem("asc_currentProviderId")) || getProviders()[0].id;

/* --- tabs --- */
document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
});

/* --- provider switcher (demo convenience) --- */
function populateSwitcher() {
    const select = document.getElementById("providerSwitch");
    select.innerHTML = getProviders().map(p =>
        `<option value="${p.id}" ${p.id === currentProviderId ? "selected" : ""}>${escapeHTML(p.businessName)}</option>`
    ).join("");
}

document.getElementById("providerSwitch").addEventListener("change", (e) => {
    currentProviderId = Number(e.target.value);
    localStorage.setItem("asc_currentProviderId", currentProviderId);
    renderAll();
});

/* --- profile --- */
function loadProfileForm() {
    const p = getProvider(currentProviderId);
    document.getElementById("pBusinessName").value = p.businessName;
    document.getElementById("pOwnerName").value = p.ownerName;
    document.getElementById("pCategory").value = p.category;
    document.getElementById("pCourt").value = p.court;
    document.getElementById("pPhone").value = p.phone;
    document.getElementById("pEmail").value = p.email;
    document.getElementById("pHours").value = p.hours;
    document.getElementById("pDescription").value = p.description;

    const note = document.getElementById("statusNote");
    const cls = { "Verified": "status-Verified", "Pending": "status-Pending", "Under Review": "status-UnderReview", "Suspended": "status-Suspended" }[p.verificationStatus];
    note.className = "status-note " + cls;
    note.innerHTML = `<i class="fa-solid fa-shield-halved"></i> Verification status: <strong>${p.verificationStatus}</strong>` +
        (p.verificationStatus === "Verified" ? " — your profile is publicly visible." : " — visible to admins only until verified.");
}

document.getElementById("profileForm").addEventListener("submit", (e) => {
    e.preventDefault();
    updateProvider(currentProviderId, {
        businessName: document.getElementById("pBusinessName").value.trim(),
        ownerName: document.getElementById("pOwnerName").value.trim(),
        category: document.getElementById("pCategory").value,
        court: document.getElementById("pCourt").value,
        phone: document.getElementById("pPhone").value.trim(),
        email: document.getElementById("pEmail").value.trim(),
        hours: document.getElementById("pHours").value.trim(),
        description: document.getElementById("pDescription").value.trim()
    });
    populateSwitcher();
    alert("Profile updated.");
});

/* --- services --- */
function renderServices() {
    const services = getServicesByProvider(currentProviderId);
    document.getElementById("servicesList").innerHTML = services.map(s => `
        <div class="service-item">
            <div>
                <strong>${escapeHTML(s.name)}</strong>
                <div style="color:#6b7280;font-size:11px;">${escapeHTML(s.category)} · KES ${formatKES(s.price)} ${escapeHTML(s.priceUnit)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <label class="availability-toggle">
                    <input type="checkbox" ${s.available ? "checked" : ""} onchange="toggleAvailability(${s.id}, this.checked)">
                    Available
                </label>
                <button class="btn btn-danger" onclick="removeService(${s.id})"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
    `).join("") || "<p style='color:#6b7280;font-size:13px;'>No services added yet.</p>";
}

function toggleAvailability(serviceId, checked) {
    updateService(serviceId, { available: checked });
}

function removeService(serviceId) {
    if (confirm("Remove this service?")) {
        deleteService(serviceId);
        renderServices();
    }
}

document.getElementById("serviceForm").addEventListener("submit", (e) => {
    e.preventDefault();
    addService({
        providerId: currentProviderId,
        name: document.getElementById("sName").value.trim(),
        category: document.getElementById("sCategory").value.trim(),
        price: Number(document.getElementById("sPrice").value),
        priceUnit: document.getElementById("sPriceUnit").value.trim(),
        icon: "fa-briefcase"
    });
    e.target.reset();
    renderServices();
});

/* --- bookings --- */
function renderBookings() {
    const bookings = getBookingsByProvider(currentProviderId);
    document.getElementById("bookingsBody").innerHTML = bookings.map(b => `
        <tr>
            <td>${escapeHTML(b.residentName)}<br><span style="color:#9ca3af;font-size:11px;">${escapeHTML(b.residentPhone)}</span></td>
            <td>${escapeHTML(b.serviceName)}</td>
            <td>${escapeHTML(b.date)} ${escapeHTML(b.time || "")}</td>
            <td><span class="badge badge-${b.status}">${b.status}</span></td>
            <td>
                <div class="row-actions">
                    ${b.status === "pending" ? `<button class="btn btn-primary" onclick="setStatus(${b.id},'accepted')">Accept</button>
                        <button class="btn btn-danger" onclick="setStatus(${b.id},'cancelled')">Decline</button>` : ""}
                    ${b.status === "accepted" ? `<button class="btn btn-primary" onclick="setStatus(${b.id},'completed')">Mark Completed</button>` : ""}
                    ${(b.status === "completed" || b.status === "cancelled") ? "—" : ""}
                </div>
            </td>
        </tr>
    `).join("") || `<tr><td colspan="5" style="color:#6b7280;">No booking requests yet.</td></tr>`;
}

function setStatus(bookingId, status) {
    updateBookingStatus(bookingId, status);
    renderBookings();
}

function renderAll() {
    document.getElementById("providerSwitch").value = currentProviderId;
    loadProfileForm();
    renderServices();
    renderBookings();
}

populateSwitcher();
renderAll();
</script>
</body>
</html>
