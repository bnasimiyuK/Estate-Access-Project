<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visitor Access Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header -->
  <div id="header" class="w-full bg-blue-900 text-white py-3 text-center">
    <h1 class="text-lg font-semibold">Visitor Access Dashboard</h1>
  </div>

  <main class="p-4 max-w-6xl mx-auto mt-4">

    <!-- Stats Bar (Moved to top) -->
    <div id="statsBar" class="flex justify-center gap-4 mb-6 flex-wrap">
      <div class="bg-white px-5 py-2 rounded-xl shadow text-center min-w-[120px]">
        <div class="text-xs text-gray-500 uppercase tracking-wide">Total Visitors</div>
        <div id="totalCount" class="text-xl font-bold text-gray-800">0</div>
      </div>
      <div class="bg-yellow-100 px-5 py-2 rounded-xl shadow text-center min-w-[120px]">
        <div class="text-xs text-yellow-800 uppercase tracking-wide">Pending</div>
        <div id="pendingCountBadge" class="text-xl font-bold text-yellow-900">0</div>
      </div>
      <div class="bg-green-100 px-5 py-2 rounded-xl shadow text-center min-w-[120px]">
        <div class="text-xs text-green-800 uppercase tracking-wide">Approved</div>
        <div id="approvedCountBadge" class="text-xl font-bold text-green-900">0</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex justify-center gap-4">
      <button id="tabRegister" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Visitor Registration</button>
      <button id="tabPending" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Pending Approvals</button>
    </div>

    <!-- Visitor Registration Section -->
    <section id="registerSection" class="mt-8">
      <h2 class="text-lg font-bold mb-4">Register Visitor</h2>

      <form id="visitorForm" class="space-y-3 bg-white p-6 rounded-xl shadow-lg" novalidate>

        <!-- Registration Type -->
        <div>
          <label class="block font-medium">Registration Type <span class="text-red-600">*</span>:</label>
          <select id="registrationType" class="w-full border p-2 rounded-lg" required>
            <option value="single">Single Visitor</option>
            <option value="group">Group Visit</option>
          </select>
        </div>

        <!-- Visitor Entries -->
        <div id="visitorContainer" class="space-y-2">
          <div class="visitor-entry bg-gray-50 p-4 rounded relative border">
            <button type="button" class="removeVisitorBtn absolute top-2 right-2 bg-red-600 text-white px-2 py-0.5 rounded hover:bg-red-700 hidden">Remove</button>

            <div class="space-y-2">
              <div>
                <label class="block text-sm font-medium text-gray-700">Visitor Name <span class="text-red-600">*</span></label>
                <input type="text" name="VisitorName" class="input-box w-full px-3 py-2 border rounded-lg" required>
                <p class="error-msg text-red-600 text-sm hidden"></p>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">National ID <span class="text-red-600">*</span></label>
                <input type="text" name="NationalID" maxlength="8" class="input-box w-full px-3 py-2 border rounded-lg" required>
                <p class="error-msg text-red-600 text-sm hidden"></p>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Phone Number <span class="text-red-600">*</span></label>
                <input type="text" name="PhoneNumber" class="input-box w-full px-3 py-2 border rounded-lg" placeholder="07######## or +2547########" required>
                <p class="error-msg text-red-600 text-sm hidden"></p>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Purpose of Visit <span class="text-red-600">*</span></label>
                <input type="text" name="Purpose" class="input-box w-full px-3 py-2 border rounded-lg" required>
                <p class="error-msg text-red-600 text-sm hidden"></p>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Date of Visit <span class="text-red-600">*</span></label>
                <input type="datetime-local" name="DateOfVisit" class="input-box w-full px-3 py-2 border rounded-lg" required>
                <p class="error-msg text-red-600 text-sm hidden"></p>
              </div>
            </div>
          </div>
        </div>

        <!-- Add Visitor Button for group -->
        <button type="button" id="addVisitorBtn" class="hidden bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Add Visitor</button>

        <div class="pt-2">
          <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Submit Registration</button>
        </div>
        <p id="msgRegister" class="mt-3 text-center text-green-600"></p>
      </form>
    </section>

    <!-- Pending Approvals Section -->
    <section id="pendingSection" class="hidden mt-8">
      <h2 class="text-lg font-bold mb-2">Pending Visitor Approvals <span id="pendingSectionCount"></span></h2>
      <div class="flex justify-end gap-2 mb-2">
        <button id="exportPendingCSV" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">Export CSV</button>
        <button id="exportPendingExcel" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">Export Excel</button>
      </div>
      <table id="pendingTable" class="min-w-full border border-gray-300">
        <thead class="bg-gray-200">
          <tr>
            <th class="py-2 px-3 border"><input type="text" placeholder="Visitor Name" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="Resident Name" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="House" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="Date" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border">Status</th>
            <th class="py-2 px-3 border">Approvers</th>
            <th class="py-2 px-3 border">Action</th>
          </tr>
        </thead>
        <tbody id="requestsTable" class="bg-white"></tbody>
      </table>
    </section>

    <!-- Approved Visitors Section -->
    <section id="approvedSection" class="mt-8">
      <h2 class="text-lg font-bold mb-2">Approved Visitors <span id="approvedSectionCount"></span></h2>
      <div class="flex justify-end gap-2 mb-2">
        <button id="exportApprovedCSV" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">Export CSV</button>
        <button id="exportApprovedExcel" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">Export Excel</button>
      </div>
      <table id="approvedTable" class="min-w-full border border-gray-300">
        <thead class="bg-gray-200">
          <tr>
            <th class="py-2 px-3 border"><input type="text" placeholder="Visitor Name" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="Resident Name" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="House" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="Date" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="Access Code" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="Allowed Visitors" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="Level 1 Approved By" class="filter-input w-full px-1"/></th>
            <th class="py-2 px-3 border"><input type="text" placeholder="Level 2 Approved By" class="filter-input w-full px-1"/></th>
          </tr>
        </thead>
        <tbody id="approvedTableBody" class="bg-white"></tbody>
      </table>
    </section>
  
  </main>

  <!-- JS -->
  <script src="js/visitorsaccess.js" type="module"></script>

</body>
</html>
