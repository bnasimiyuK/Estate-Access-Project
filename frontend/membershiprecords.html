<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership Records | Admin Portal</title>

  <!-- ✅ Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>

<body class="min-h-screen bg-gray-50 text-gray-800 font-[Poppins]">
  <!-- 🧭 Navbar (Loaded Dynamically) -->
  <div id="header" class="w-full bg-blue-900 text-white py-3 text-center">
    <h1 class="text-lg font-semibold">Athi Estate Access Management System</h1>
  </div>

  <!-- 📋 Membership Records Section -->
  <main class="p-8">
    <section class="mb-8">
      <h1 class="text-3xl font-semibold text-blue-800 mb-6 border-b-2 border-blue-500 pb-2">
        Membership Records
      </h1>

      <!-- ✅ Info Message -->
      <div id="msg" class="text-sm text-gray-700 mb-3"></div>

      <!-- ✅ Record Count, Status, and Action Info -->
     
      <p>Total Records: <span id="membershipCount">0</span></p>
<p id="statusLabel">Approved: 0 | Pending: 0 | Rejected: 0</p>
<p id="actionText">Last Updated: N/A</p>


      <!-- ✅ Membership Records Table -->
      <div class="bg-white rounded-xl border border-gray-300 shadow-md p-6 overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead>
            <tr class="bg-blue-700 text-white">
              <th class="px-4 py-3">RequestID</th>
              <th class="px-4 py-3">ResidentName</th>
              <th class="px-4 py-3">NationalID</th>
              <th class="px-4 py-3">PhoneNumber</th>
              <th class="px-4 py-3">Email</th>
              <th class="px-4 py-3">HouseNumber</th>
              <th class="px-4 py-3">CourtName</th>
              <th class="px-4 py-3">RoleName</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">RequestedAt</th>
              <th class="px-4 py-3 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="membershipTableBody" class="text-gray-700"></tbody>
        </table>
      </div>
    </section>

    <!-- ✨ Footer -->
    <footer class="mt-8 text-center text-gray-500 text-sm">
      &copy; <span id="year"></span> Athi Highway Estate Access Management System
    </footer>
  </main>

  <!-- ✅ JS Scripts -->
  <script src="js/main.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/membershiprecords.js" defer></script>
</body>
</html>
