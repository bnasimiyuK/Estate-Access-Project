<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Receipts | Athi Estate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-6">

  <h1 class="text-3xl font-bold mb-6 text-gray-800">My Receipts</h1>

  <!-- Search/filter -->
  <div class="mb-4">
    <input type="text" id="searchInput" placeholder="Search by Payment ID or Date (YYYY-MM-DD)" 
           class="w-full sm:w-1/2 px-4 py-2 border rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <!-- Loader -->
  <div id="loader" class="text-center mb-4 hidden">
    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
    <p class="mt-2 text-gray-600">Loading payments...</p>
  </div>

  <!-- Payments Table -->
  <div class="overflow-x-auto">
    <table class="min-w-full bg-white shadow rounded-lg">
      <thead class="bg-blue-500 text-white cursor-pointer">
        <tr>
          <th class="px-4 py-2 text-left" data-sort="PaymentID">Payment ID ▲▼</th>
          <th class="px-4 py-2 text-left" data-sort="PaidAmount">Amount ▲▼</th>
          <th class="px-4 py-2 text-left" data-sort="VerifiedDate">Date ▲▼</th>
          <th class="px-4 py-2 text-left">Action</th>
        </tr>
      </thead>
      <tbody id="receiptsTableBody">
        <!-- Populated by JS -->
      </tbody>
    </table>
  </div>

  <!-- Pagination Controls -->
  <div class="flex justify-center mt-4 gap-2" id="paginationControls"></div>

  <!-- Receipt Modal -->
  <div id="receiptModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 overflow-auto p-4">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
      <h2 class="text-xl font-bold mb-4">Receipt Preview</h2>
      <div id="modalContent" class="text-gray-700 mb-4 max-h-[60vh] overflow-y-auto pr-2"></div>
      <div class="flex justify-end gap-2">
        <button id="cancelBtn" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancel</button>
        <button id="downloadBtn" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Download PDF</button>
      </div>
    </div>
  </div>

  <!-- Receipts JS -->
  <script type="module" src="./js/receipts.js"></script>

</body>
</html>
