<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>404 | Page Not Found</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
                 "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
    cursor: default;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8fafc;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  section {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  section span {
    font-size: 4rem;
    font-weight: 600;
    border-bottom: 1px solid #eaeaea;
    padding-bottom: 20px;
    display: block;
    width: 100px;
  }

  section p {
    font-size: 1rem;
    margin-top: 20px;
    color: #555;
  }

  .btn-home {
    margin-top: 30px;
    padding: 10px 20px;
    background-color: #1e40af;
    color: #fff;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 500;
    transition: background-color 0.3s ease;
  }

  .btn-home:hover {
    background-color: #2563eb;
  }

  @media (min-width: 768px) {
    section {
      flex-direction: row;
      align-items: center;
    }
    section span {
      border-bottom: 0;
      border-right: 1px solid #eaeaea;
      padding-right: 20px;
      margin-right: 20px;
      width: auto;
    }
    section p {
      margin: 0;
      padding-left: 20px;
    }
  }
</style>
</head>
<body>
<main>
  <section>
    <span>404</span>
    <p>The requested path could not be found</p>
  </section>
  <a href="residentdashboard.html" class="btn-home">Go Back Home</a>
</main>
</body>
</html>
