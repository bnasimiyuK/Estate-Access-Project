<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Membership | Athi Estate Access Management System</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-gray-800 relative">

<!-- Header -->
<div class="w-full bg-blue-900 text-white py-2 text-center">
  <h1 class="text-lg font-semibold">Athi Estate Access Management System</h1>
  <p class="text-sm mt-1">Total Membership Requests: <span id="membershipCount" class="font-bold">0</span></p>
</div>

<!-- Membership Form -->
<main class="flex justify-center items-center min-h-screen">
  <div class="max-w-md w-full p-6 text-sm bg-white/95 backdrop-blur-sm rounded-xl shadow-lg overflow-auto">
    <h2 class="text-lg font-semibold mb-4 text-center text-blue-800">Membership Request</h2>

    <!-- Form -->
    <form id="membershipForm" class="space-y-3">
      <div>
        <input type="text" id="ResidentName" name="ResidentName" placeholder="Full Name" required class="w-full px-3 py-2 border rounded" />
      </div>

      <div>
        <input type="text" id="NationalID" name="NationalID" placeholder="National ID (8 digits)" required class="w-full px-3 py-2 border rounded" />
      </div>

      <div>
        <input type="text" id="PhoneNumber" name="PhoneNumber" 
               placeholder="Phone Number (+254XXXXXXXXX or 0XXXXXXXXX)" 
               required 
               class="w-full px-3 py-2 border rounded" />
        <small class="text-gray-500 text-xs">
          Enter phone number as +254XXXXXXXXX or 0XXXXXXXXX
        </small>
      </div>

      <div>
        <input type="email" id="Email" name="Email" placeholder="Email Address" required class="w-full px-3 py-2 border rounded" />
      </div>

      <div>
        <input type="text" id="HouseNumber" name="HouseNumber" placeholder="House Number" required class="w-full px-3 py-2 border rounded" />
      </div>

      <div>
        <select id="courtDropdown" class="w-full px-3 py-2 border rounded mb-1">
          <option value="">Select Court</option>
        </select>
      </div>

      <div>
        <select id="RoleName" name="RoleName" required class="w-full px-3 py-2 border rounded mb-1">
          <option value="">Select Your Role</option>
          <option value="Admin">Admin</option>
          <option value="Resident">Resident</option>
          <option value="Visitor">Visitor</option>
        </select>
      </div>

      <div>
        <textarea id="Action" name="Action" rows="3" placeholder="Notes / Reason (Optional)" class="w-full px-3 py-2 border rounded"></textarea>
      </div>

      <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 text-base font-semibold">
        Submit Request
      </button>
    </form>

    <!-- Bulk Upload Section -->
    <div class="mt-4 border-t pt-3">
      <h3 class="text-sm font-semibold mb-2 text-gray-800">Bulk Membership Upload</h3>

      <button id="downloadTemplateBtn" class="w-full mb-2 bg-gray-600 text-white py-2 rounded hover:bg-gray-700 text-base font-semibold">
        Download CSV Template
      </button>

      <input type="file" id="bulkFile" accept=".csv" class="w-full px-3 py-2 border rounded"/>
      <button id="uploadBulkBtn" class="w-full mt-2 bg-green-600 text-white py-2 rounded hover:bg-green-700 text-base font-semibold">
        Upload CSV
      </button>
    </div>

    <p id="feedbackMessage" class="mt-2 text-center p-2 rounded text-sm"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/membership.js"></script>

<footer class="fixed bottom-0 left-0 w-full bg-blue-900/90 text-white text-center py-2 text-sm">
  <p>&copy; <span id="year"></span> Athi Estate Access System</p>
</footer>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
