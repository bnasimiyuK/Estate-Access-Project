<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Athi Estate Access Management System</title>

  <!-- ✅ Tailwind (Development CDN - use CLI in production) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="text-gray-800 relative">

  <!-- 🔹 Background -->
  <video autoplay muted loop playsinline class="fixed top-0 left-0 w-full h-full object-cover -z-10">
    <source src="assets/Hero.webm" type="video/mp4">
  </video>
  <div class="absolute inset-0 bg-black/50 -z-10"></div>

  <!-- 🔹 Header -->
  <div id="header"></div>
  <script>
    async function loadHeader() {
      try {
        const res = await fetch("partials/header.html");
        const html = await res.text();
        document.getElementById("header").innerHTML = html;

        // Load navbar JS after header
        const script = document.createElement("script");
        script.src = "js/navbar.js";
        document.body.appendChild(script);
      } catch (err) {
        console.error("❌ Failed to load header:", err);
      }
    }
    loadHeader();
  </script>

  <!-- 🔹 Main Content -->
  <main>
    <div class="fit-screen text-sm flex flex-col items-center justify-center min-h-[80vh] px-4">
      <h2 class="text-lg font-semibold mb-3 text-center text-blue-700">Admin Login</h2>

      <!-- ✅ LOGIN FORM UPDATED TO EMAIL + PASSWORD -->
      <form id="loginForm" class="space-y-3 w-full max-w-sm bg-white/90 p-6 rounded-xl shadow-lg text-gray-800">
        
        <!-- 🔹 Email -->
        <input id="Email" type="email" placeholder="Email Address"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-600 outline-none" required />

        <!-- 🔹 Password -->
        <input id="Password" type="password" placeholder="Password"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-600 outline-none" required />

        <!-- 🔹 Login Button -->
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium transition">
          Login
        </button>

        <p id="msg" class="text-center text-sm mt-2"></p>
      </form>

      <p class="mt-3 text-xs text-center text-gray-200">
        Not yet a member?
        <a href="membership.html" class="text-blue-400 hover:underline">Request Membership</a>
      </p>
    </div>
  </main>

  <!-- 🔹 Footer -->
  <footer class="bg-blue-900 text-white text-center py-2 text-xs">
    <p>&copy; <span id="year"></span> Athi Estate Access System. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="js/login.js" defer></script>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
