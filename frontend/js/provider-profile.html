<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Profile | Athi Soko Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Poppins", sans-serif; background: #f4f7fb; color: #1f2937; }
a { text-decoration: none; color: inherit; }
.top-header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 45px; height: 45px; border-radius: 12px; background: #1e3a8a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.brand h1 { font-size: 18px; color: #1e3a8a; }
.brand span { display: block; font-size: 11px; color: #6b7280; }
.header-link { color: #4b5563; font-size: 14px; margin-right: 18px; }
.container { max-width: 950px; margin: 30px auto; padding: 0 20px; }
.breadcrumb { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
.breadcrumb a { color: #1d4ed8; }
.profile-card { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 28px; }
.profile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
.profile-icon { width: 70px; height: 70px; border-radius: 16px; background: #dbeafe; color: #1d4ed8; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.profile-name-row { display: flex; gap: 14px; align-items: center; }
.profile-name { font-size: 22px; font-weight: 600; }
.owner { color: #6b7280; font-size: 13px; margin-top: 3px; }
.badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-verified { background: #dcfce7; color: #166534; }
.badge-pending { background: #fef9c3; color: #854d0e; }
.badge-review { background: #dbeafe; color: #1e3a8a; }
.badge-suspended { background: #fee2e2; color: #991b1b; }
.rating-row { color: #f59e0b; font-size: 14px; margin-top: 10px; }
.rating-row span { color: #6b7280; margin-left: 6px; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 24px 0; }
.info-item { background: #f9fafb; border-radius: 10px; padding: 14px; }
.info-item .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.info-item .value { font-size: 14px; font-weight: 500; }
.section-title { font-size: 15px; font-weight: 600; margin: 26px 0 12px; }
.description { color: #4b5563; font-size: 14px; line-height: 1.7; }
.services-list { display: grid; gap: 10px; }
.service-row { display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; }
.service-row .name { font-weight: 500; font-size: 13px; }
.service-row .price { color: #1d4ed8; font-weight: 600; font-size: 13px; }
.unavailable-tag { color: #dc2626; font-size: 11px; margin-left: 8px; }
.btn { padding: 11px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; border: 1px solid transparent; }
.btn-primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
</style>
</head>
<body>

<header class="top-header">
    <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-house-circle-check"></i></div>
        <div><h1>Athi Soko Connect</h1><span>Athi Highway Estate Community Marketplace</span></div>
    </div>
    <div><a href="services-search.html" class="header-link">Browse Services</a></div>
</header>

<main class="container">
    <div class="breadcrumb"><a href="services-search.html">Services</a> <i class="fa-solid fa-chevron-right"></i> Provider Profile</div>
    <div id="profileContainer"></div>
</main>

<script src="shared-data.js"></script>
<script src="js/provider-profile.js"></script>
</body>
</html>
