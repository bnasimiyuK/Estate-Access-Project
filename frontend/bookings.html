<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | Athi Soko Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Poppins", sans-serif; background: #f4f7fb; color: #1f2937; }
a { text-decoration: none; color: inherit; }
.top-header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 45px; height: 45px; border-radius: 12px; background: #1e3a8a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.brand h1 { font-size: 18px; color: #1e3a8a; }
.container { max-width: 850px; margin: 30px auto; padding: 0 20px; }
h2 { margin-bottom: 18px; }
.filter-row { display: flex; gap: 8px; margin-bottom: 18px; }
.filter-row button { border: 1px solid #d1d5db; background: #fff; padding: 7px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; }
.filter-row button.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
.booking-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.booking-card .name { font-weight: 600; font-size: 14px; }
.booking-card .meta { font-size: 12px; color: #6b7280; margin-top: 4px; }
.badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-pending { background: #fef9c3; color: #854d0e; }
.badge-accepted { background: #dbeafe; color: #1e3a8a; }
.badge-completed { background: #dcfce7; color: #166534; }
.badge-cancelled { background: #fee2e2; color: #991b1b; }
.actions { display: flex; gap: 8px; align-items: center; }
.btn { padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; border: 1px solid #d1d5db; background: #fff; }
.btn-danger { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
.empty { color: #6b7280; font-size: 13px; padding: 30px; text-align: center; }
</style>
</head>
<body>

<header class="top-header">
    <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-house-circle-check"></i></div>
        <div><h1>Athi Soko Connect</h1></div>
    </div>
    <a href="services-search.html">Browse Services</a>
</header>

<main class="container">
    <h2>My Bookings</h2>

    <div class="filter-row" id="filterRow">
        <button class="active" data-status="all">All</button>
        <button data-status="pending">Pending</button>
        <button data-status="accepted">Accepted</button>
        <button data-status="completed">Completed</button>
        <button data-status="cancelled">Cancelled</button>
    </div>

    <div id="bookingsList"></div>
</main>

<script src="shared-data.js"></script>
<script>
let activeFilter = "all";

document.querySelectorAll("#filterRow button").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll("#filterRow button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.status;
        render();
    });
});

function render() {
    let bookings = getBookings();

    if (activeFilter !== "all") {
        bookings = bookings.filter(b => b.status === activeFilter);
    }

    const list = document.getElementById("bookingsList");

    if (!bookings.length) {
        list.innerHTML = "<div class='empty'>No bookings found.</div>";
        return;
    }

    list.innerHTML = bookings.map(b => `
        <div class="booking-card">
            <div>
                <div class="name">${escapeHTML(b.serviceName)}</div>
                <div class="meta">${escapeHTML(b.date)} ${escapeHTML(b.time || "")} · ${escapeHTML(b.court || "")}</div>
                <div class="meta">Requested by ${escapeHTML(b.residentName)}</div>
            </div>
            <div class="actions">
                <span class="badge badge-${b.status}">${b.status}</span>
                ${b.status === "pending" ? `<button class="btn btn-danger" onclick="cancelBooking(${b.id})">Cancel</button>` : ""}
            </div>
        </div>
    `).join("");
}

function cancelBooking(id) {
    if (confirm("Cancel this booking request?")) {
        updateBookingStatus(id, "cancelled");
        render();
    }
}

render();
</script>
</body>
</html>
