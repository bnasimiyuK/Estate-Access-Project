<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athi Highway Estate | Home</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative min-h-screen overflow-x-hidden text-white">

  <!--Background Video -->
  <div class="fixed inset-0 -z-10">
    <video class="w-full h-full object-cover" autoplay muted loop playsinline>
      <source src="assets/Hero.webm" type="video/mp4" />
    </video>
    <div class="absolute inset-0 bg-black/60"></div>
  </div>

  <!--Dynamic Header (loads from partials/header.html) -->
  <div id="header"></div>
  
  <!--Hero Section -->
  <main class="flex flex-col items-center justify-center text-center min-h-screen px-6 pt-24">
    <h1 class="text-4xl md:text-6xl font-bold mb-6 leading-tight">Welcome to Athi Highway Estate</h1>
    <p class="max-w-2xl mx-auto text-gray-200 text-lg md:text-xl mb-10">
      A smart and secure community where technology meets tranquility.<br />
      Manage your access, guests, and amenities — all in one platform.
    </p>

    <div class="flex flex-wrap justify-center gap-4">
      <button id="openGalleryBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl text-lg font-semibold shadow-lg transition">Gallery</button>
      <button id="openVideosBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl text-lg font-semibold shadow-lg transition">Videos</button>
      <button id="openEventsBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl text-lg font-semibold shadow-lg transition">Events</button>
    </div>
  </main>

  <!-- Gallery Modal -->
  <!-- (keep your existing gallery/video modal content) -->

  <!-- Scroll to Top Button -->
  <button id="scrollTopBtn" class="hidden fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-lg transition-all duration-300 z-50">↑</button>

  <!-- Footer -->
  <footer class="text-center py-4 bg-black/40 backdrop-blur-sm text-sm border-t border-white/20">
    <p>&copy; <span id="year"></span> Athi Highway Estate. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  <script></script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
